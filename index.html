<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ប្រព័ន្ធគ្រប់គ្រងជីវប្រវត្តិសិស្ស</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f4f6f9; color: #333; }
    .main-card { border: none; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); background: #ffffff; }
    .card-header-custom { background: linear-gradient(135deg, #0d6efd, #0b5ed7); color: white; border-top-left-radius: 15px !important; border-top-right-radius: 15px !important; padding: 1.2rem; }
    .form-label { font-weight: 500; color: #495057; margin-bottom: 4px; }
    .form-control, .form-select { border-radius: 8px; padding: 8px 12px; border: 1px solid #ced4da; }
    .section-title { font-size: 1.05rem; font-weight: 700; color: #0d6efd; border-bottom: 2px solid #e9ecef; padding-bottom: 6px; margin-top: 15px; margin-bottom: 15px; }
    .btn-custom { border-radius: 8px; padding: 8px 18px; font-weight: 600; }
  </style>
</head>
<body>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      
      <div class="card main-card">
        <div class="card-header card-header-custom text-center">
          <h3 class="mb-1"><i class="fa-solid fa-graduation-cap me-2"></i>ទម្រង់បញ្ចូលជីវប្រវត្តិសិស្ស</h3>
          <p class="mb-0 fs-6 opacity-75">ប្រព័ន្ធគ្រប់គ្រង និងរក្សាទុកទិន្នន័យសិស្សស្វ័យប្រវត្តិ</p>
        </div>
        
        <div class="card-body p-4">
          <form id="studentForm" onsubmit="handleFormSubmit(event)">
            
            <!-- ព័ត៌មានផ្ទាល់ខ្លួន -->
            <div class="section-title"><i class="fa-solid fa-user me-2"></i>ព័ត៌មានផ្ទាល់ខ្លួនសិស្ស</div>
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">អត្តលេខ <span class="text-danger">*</span></label>
                <input type="text" id="studentId" class="form-control" placeholder="ឧ. STU-001" required>
              </div>
              <div class="col-md-5">
                <label class="form-label">គោត្តនាម-នាមខ្លួន <span class="text-danger">*</span></label>
                <input type="text" id="fullName" class="form-control" placeholder="បញ្ចូលឈ្មោះពេញ" required>
              </div>
              <div class="col-md-3">
                <label class="form-label">ភេទ</label>
                <select id="gender" class="form-select">
                  <option value="ប្រុស">ប្រុស</option>
                  <option value="ស្រី">ស្រី</option>
                </select>
              </div>
              
              <div class="col-md-4">
                <label class="form-label">ថ្ងៃខែឆ្នាំកំណើត</label>
                <input type="date" id="dob" class="form-control">
              </div>
              <div class="col-md-4">
                <label class="form-label">លេខទូរស័ព្ទ (សាម៉ីខ្លួន)</label>
                <input type="tel" id="studentPhone" class="form-control" placeholder="012345678">
              </div>
              <div class="col-md-4">
                <label class="form-label">អាសយដ្ឋានបច្ចុប្បន្ន</label>
                <input type="text" id="address" class="form-control" placeholder="ភូមិ/ឃុំ/ស្រុក/ខេត្ត">
              </div>
            </div>

            <!-- ព័ត៌មានអាណាព្យាបាល -->
            <div class="section-title"><i class="fa-solid fa-users me-2"></i>ព័ត៌មានឪពុកម្តាយ / អាណាព្យាបាល</div>
            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label">ឈ្មោះឪពុក</label>
                <input type="text" id="fatherName" class="form-control">
              </div>
              <div class="col-md-3">
                <label class="form-label">មុខរបរ (ឪពុក)</label>
                <input type="text" id="fatherJob" class="form-control">
              </div>
              <div class="col-md-3">
                <label class="form-label">អាសយដ្ឋាន (ឪពុក)</label>
                <input type="text" id="fatherAddress" class="form-control">
              </div>
              <div class="col-md-3">
                <label class="form-label">លេខទូរស័ព្ទ (ឪពុក)</label>
                <input type="tel" id="fatherPhone" class="form-control">
              </div>

              <div class="col-md-3">
                <label class="form-label">ឈ្មោះម្តាយ</label>
                <input type="text" id="motherName" class="form-control">
              </div>
              <div class="col-md-3">
                <label class="form-label">មុខរបរ (ម្តាយ)</label>
                <input type="text" id="motherJob" class="form-control">
              </div>
              <div class="col-md-3">
                <label class="form-label">អាសយដ្ឋាន (ម្តាយ)</label>
                <input type="text" id="motherAddress" class="form-control">
              </div>
              <div class="col-md-3">
                <label class="form-label">លេខទូរស័ព្ទ (ម្តាយ)</label>
                <input type="tel" id="motherPhone" class="form-control">
              </div>
            </div>

            <!-- ព័ត៌មានការប្រឡង -->
            <div class="section-title"><i class="fa-solid fa-file-signature me-2"></i>ព័ត៌មានការប្រឡង</div>
            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label">លេខតុ</label>
                <input type="text" id="deskNo" class="form-control">
              </div>
              <div class="col-md-3">
                <label class="form-label">លេខបន្ទប់</label>
                <input type="text" id="roomNo" class="form-control">
              </div>
              <div class="col-md-3">
                <label class="form-label">សម័យប្រឡង</label>
                <input type="text" id="examSession" class="form-control">
              </div>
              <div class="col-md-3">
                <label class="form-label">មណ្ឌលប្រឡង</label>
                <input type="text" id="examCenter" class="form-control">
              </div>
              <div class="col-md-12">
                <label class="form-label">ផ្សេងៗ (ចំណាំ)</label>
                <textarea id="note" class="form-control" rows="2"></textarea>
              </div>
            </div>

            <!-- Action Buttons ទាំងអស់ -->
            <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mt-4 pt-3 border-top">
              <div class="d-flex gap-2">
                <button type="button" class="btn btn-outline-success btn-custom" onclick="openExportLink('sheet')">
                  <i class="fa-solid fa-file-excel me-1"></i> ទាញយក Excel/Sheet
                </button>
                
                <button type="button" class="btn btn-outline-danger btn-custom" onclick="openExportLink('pdf')">
                  <i class="fa-solid fa-file-pdf me-1"></i> ទាញយក PDF
                </button>
              </div>
              
              <div class="d-flex gap-2">
                <button type="reset" class="btn btn-light btn-custom text-secondary">
                  <i class="fa-solid fa-rotate-right me-1"></i> សម្អាត
                </button>
                <button type="submit" id="btnSubmit" class="btn btn-primary btn-custom px-4">
                  <i class="fa-solid fa-floppy-disk me-1"></i> រក្សាទុកទិន្នន័យ
                </button>
              </div>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
  // មុខងារទាញយក Link បើកក្នុង Tab ថ្មី
  function openExportLink(type) {
    Swal.fire({
      title: 'កំពុងដំណើរការ...',
      text: 'ប្រព័ន្ធកំពុងរៀបចំ Link...',
      allowOutsideClick: false,
      didOpen: () => { Swal.showLoading(); }
    });

    google.script.run
      .withSuccessHandler(function(data) {
        Swal.close();
        var url = (type === 'sheet') ? data.sheetUrl : data.pdfUrl;
        window.open(url, '_blank');
      })
      .withFailureHandler(function(err) {
        Swal.fire('កំហុស!', err.message, 'error');
      })
      .getExportUrls();
  }

  // មុខងារ រក្សាទុកទិន្នន័យ
  function handleFormSubmit(event) {
    event.preventDefault();
    
    var btn = document.getElementById("btnSubmit");
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>កំពុងរក្សាទុក...`;

    var formData = {
      studentId: document.getElementById("studentId").value,
      fullName: document.getElementById("fullName").value,
      gender: document.getElementById("gender").value,
      dob: document.getElementById("dob").value,
      address: document.getElementById("address").value,
      studentPhone: document.getElementById("studentPhone").value,
      fatherName: document.getElementById("fatherName").value,
      fatherJob: document.getElementById("fatherJob").value,
      fatherAddress: document.getElementById("fatherAddress").value,
      fatherPhone: document.getElementById("fatherPhone").value,
      motherName: document.getElementById("motherName").value,
      motherJob: document.getElementById("motherJob").value,
      motherAddress: document.getElementById("motherAddress").value,
      motherPhone: document.getElementById("motherPhone").value,
      deskNo: document.getElementById("deskNo").value,
      roomNo: document.getElementById("roomNo").value,
      examSession: document.getElementById("examSession").value,
      examCenter: document.getElementById("examCenter").value,
      note: document.getElementById("note").value
    };

    google.script.run
      .withSuccessHandler(function(response) {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-floppy-disk me-1"></i> រក្សាទុកទិន្នន័យ`;
        
        if (response && response.success) {
          Swal.fire({
            icon: 'success',
            title: 'ជោគជ័យ!',
            text: response.message,
            confirmButtonColor: '#0d6efd'
          });
          document.getElementById("studentForm").reset();
        } else {
          Swal.fire({
            icon: 'error',
            title: 'មានបញ្ហា!',
            text: (response ? response.message : 'មិនអាចបញ្ចូលបាន'),
            confirmButtonColor: '#d33'
          });
        }
      })
      .withFailureHandler(function(error) {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-floppy-disk me-1"></i> រក្សាទុកទិន្នន័យ`;
        Swal.fire({
          icon: 'error',
          title: 'កំហុសប្រព័ន្ធ!',
          text: error.message,
          confirmButtonColor: '#d33'
        });
      })
      .processWebForm(formData);
  }
</script>

</body>
</html>
